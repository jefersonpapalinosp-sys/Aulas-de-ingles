# Stack de desenvolvimento. Quatro serviços e três portas publicadas.
# As portas do host vêm do .env porque 5432/5444/5456, 8000/8001/8005 e
# 5173/5174 já estão ocupadas por outros projetos nesta máquina.
name: aulas-ingles

# As imagens vêm do espelho público da AWS, não do Docker Hub: o Hub limita
# pull anônimo por IP, e o CI compartilha IP com o resto do GitHub Actions.
# O Postgres está fixado em 16.15 para bater com os volumes já existentes.
services:
  db:
    image: public.ecr.aws/docker/library/postgres:16.15-alpine
    container_name: aulas-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aulas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aulas_local}
      POSTGRES_DB: ${POSTGRES_DB:-aulas_ingles}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Sem o -d o pg_isready responde antes do banco da aplicação existir.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aulas} -d ${POSTGRES_DB:-aulas_ingles}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ../backend
    container_name: aulas-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://aulas:aulas_local@db:5432/aulas_ingles}
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SPEAKING_STORAGE_DIR: /app/data/speaking
      ASSISTED_FEATURES_ENABLED: ${ASSISTED_FEATURES_ENABLED:-false}
      ASSIST_TRANSCRIPTION_URL: ${ASSIST_TRANSCRIPTION_URL:-}
      ASSIST_WRITING_URL: ${ASSIST_WRITING_URL:-}
      ASSIST_PROVIDER_KIND: ${ASSIST_PROVIDER_KIND:-gateway}
      ASSIST_PROVIDER_NAME: ${ASSIST_PROVIDER_NAME:-external}
      ASSIST_PROVIDER_TOKEN: ${ASSIST_PROVIDER_TOKEN:-}
      ASSIST_OLLAMA_BASE_URL: ${ASSIST_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ASSIST_OLLAMA_MODEL: ${ASSIST_OLLAMA_MODEL:-qwen2.5:7b}
      ASSIST_DAILY_QUOTA: ${ASSIST_DAILY_QUOTA:-5}
      ASSIST_RETENTION_DAYS: ${ASSIST_RETENTION_DAYS:-30}
      ASSIST_TIMEOUT_SECONDS: ${ASSIST_TIMEOUT_SECONDS:-20}
      ASSIST_JOB_MAX_ATTEMPTS: ${ASSIST_JOB_MAX_ATTEMPTS:-3}
      ASSIST_JOB_RETRY_BASE_SECONDS: ${ASSIST_JOB_RETRY_BASE_SECONDS:-5}
      ASSIST_JOB_STALE_SECONDS: ${ASSIST_JOB_STALE_SECONDS:-120}
      ASSIST_WORKER_POLL_SECONDS: ${ASSIST_WORKER_POLL_SECONDS:-1}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8010}:8000"
    volumes:
      # Hot reload: o código do host manda. O .venv da imagem é preservado.
      - ../backend/app:/app/app
      - ../backend/tests:/app/tests
      - ../backend/alembic:/app/alembic
      - ../backend/alembic.ini:/app/alembic.ini:ro
      # O seed vive na raiz do repo, fora do contexto de build da imagem.
      - ../seed:/app/seed:ro
      - speaking_data:/app/data/speaking
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/live').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: ../backend
    container_name: aulas-worker
    command: ["python", "-m", "app.cli", "assist-worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://aulas:aulas_local@db:5432/aulas_ingles}
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SPEAKING_STORAGE_DIR: /app/data/speaking
      ASSISTED_FEATURES_ENABLED: ${ASSISTED_FEATURES_ENABLED:-false}
      ASSIST_TRANSCRIPTION_URL: ${ASSIST_TRANSCRIPTION_URL:-}
      ASSIST_PROVIDER_NAME: ${ASSIST_PROVIDER_NAME:-external}
      ASSIST_PROVIDER_TOKEN: ${ASSIST_PROVIDER_TOKEN:-}
      ASSIST_TIMEOUT_SECONDS: ${ASSIST_TIMEOUT_SECONDS:-20}
      ASSIST_JOB_MAX_ATTEMPTS: ${ASSIST_JOB_MAX_ATTEMPTS:-3}
      ASSIST_JOB_RETRY_BASE_SECONDS: ${ASSIST_JOB_RETRY_BASE_SECONDS:-5}
      ASSIST_JOB_STALE_SECONDS: ${ASSIST_JOB_STALE_SECONDS:-120}
      ASSIST_WORKER_POLL_SECONDS: ${ASSIST_WORKER_POLL_SECONDS:-1}
    volumes:
      - ../backend/app:/app/app
      - speaking_data:/app/data/speaking
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../frontend
    container_name: aulas-web
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api:8000}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5180}:5180"
    volumes:
      # Montar a raiz evita que um checkout do Git invalide bind mounts de
      # arquivos individuais (index.html/vite.config.ts) enquanto o Vite roda.
      - ../frontend:/app
      # As dependências vêm da imagem, não do node_modules do host.
      - /app/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
    name: aulas-ingles-pgdata
  speaking_data:
    name: aulas-ingles-speaking-data
