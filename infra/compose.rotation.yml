# SEC-49: somente credenciais e dados sintéticos, sem portas ou volumes do aluno.
name: aulas-ingles-rotation49
x-runtime-limits: &runtime-limits
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *runtime-limits
    image: public.ecr.aws/docker/library/postgres:16.15-alpine
    shm_size: 256m
    command: ["postgres", "-c", "log_lock_waits=on", "-c", "idle_in_transaction_session_timeout=60000",
              "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    environment:
      POSTGRES_USER: aulas_rotation_admin
      POSTGRES_PASSWORD: rotation_disposable_only
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./rotation-db-init.sql:/docker-entrypoint-initdb.d/01-rotation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aulas_rotation_admin -d aulas_rotation_lab"]
      interval: 2s
      timeout: 3s
      retries: 30
networks:
  default:
    internal: true
volumes:
  pgdata:
    labels:
      org.aulas.environment: disposable-rotation49
