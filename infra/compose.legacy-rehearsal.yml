# Ensaios históricos 39A/39F, somente sob demanda. Ver docs/operacao_local.md.
# Overlay de compose.recovery.yml; sem portas nem volumes do aluno.
x-runtime-limits: &runtime-limits
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  assist-check-db:
    <<: *runtime-limits
    profiles: ["assist-check"]
    image: public.ecr.aws/docker/library/postgres:16.15-alpine
    shm_size: 256m
    command: ["postgres", "-c", "log_lock_waits=on", "-c", "idle_in_transaction_session_timeout=60000",
              "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    environment:
      POSTGRES_USER: aulas_restore_admin
      POSTGRES_PASSWORD: restore_admin_disposable_only
      POSTGRES_DB: postgres
    depends_on:
      assist-check-volume:
        condition: service_completed_successfully
    volumes:
      - assist_check_db:/var/lib/postgresql/data
      - ./restore-db-init.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aulas_restore -d aulas_ingles_restore"]
      interval: 2s
      timeout: 3s
      retries: 30
  assist-check-volume:
    <<: *runtime-limits
    profiles: ["assist-check"]
    image: public.ecr.aws/docker/library/postgres:16.15-alpine
    entrypoint: ["true"]
    volumes:
      - assist_check_voice:/voice
  dev-check-db:
    <<: *runtime-limits
    profiles: ["dev-check"]
    image: public.ecr.aws/docker/library/postgres:16.15-alpine
    shm_size: 256m
    command: ["postgres", "-c", "log_lock_waits=on", "-c", "idle_in_transaction_session_timeout=60000",
              "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    environment:
      POSTGRES_USER: aulas_restore_admin
      POSTGRES_PASSWORD: restore_admin_disposable_only
      POSTGRES_DB: postgres
    depends_on:
      dev-check-volume:
        condition: service_completed_successfully
    volumes:
      - dev_check_db:/var/lib/postgresql/data
      - ./restore-db-init.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aulas_restore -d aulas_ingles_restore"]
      interval: 2s
      timeout: 3s
      retries: 30
  dev-check-volume:
    <<: *runtime-limits
    profiles: ["dev-check"]
    image: public.ecr.aws/docker/library/postgres:16.15-alpine
    entrypoint: ["true"]
    volumes:
      - dev_check_voice:/voice
volumes:
  assist_check_db:
    labels: {org.aulas.environment: disposable-recovery}
  assist_check_voice:
    labels: {org.aulas.environment: disposable-recovery}
  dev_check_db:
    labels: {org.aulas.environment: disposable-recovery}
  dev_check_voice:
    labels: {org.aulas.environment: disposable-recovery}
