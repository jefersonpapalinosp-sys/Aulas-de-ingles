# Produção local: bundle buildado atrás de nginx, API sem reload, Postgres
# com volume próprio. Portas deslocadas para conviver com o compose de dev.
#
#   docker compose --env-file .env.prod -f infra/compose.prod.yml up -d --build
name: aulas-ingles-prod

# As imagens vêm do espelho público da AWS, não do Docker Hub: o Hub limita
# pull anônimo por IP, e o CI compartilha IP com o resto do GitHub Actions.
# O Postgres está fixado em 16.15 para bater com os volumes já existentes.
# Hardening de container, igual ao da stack pública (SEC-45): é esta stack que
# ensaia a produção, então divergir aqui tiraria o valor do ensaio. O `db` fica
# só com `no-new-privileges` porque o Postgres ajusta o dono do PGDATA e troca
# de usuário no primeiro boot do volume.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

x-backend-caps: &backend-caps
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - FOWNER
    - SETGID
    - SETUID

services:
  db:
    <<: *hardening
    image: public.ecr.aws/docker/library/postgres:16.15-alpine
    container_name: aulas-prod-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aulas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aulas_ingles}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aulas} -d ${POSTGRES_DB:-aulas_ingles}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    <<: *backend-caps
    build:
      # Contexto na raiz: a imagem precisa levar seed/ junto.
      context: ..
      dockerfile: backend/Dockerfile.prod
    container_name: aulas-prod-api
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
      APP_ENV: ${APP_ENV:-prod}
      EDITORIAL_SNAPSHOTS_ENABLED: ${EDITORIAL_SNAPSHOTS_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OPERATIONS_TOKEN: ${OPERATIONS_TOKEN:-}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-local}
      # Produção local em HTTP: a API só aceita cookie sem Secure com APP_ENV=prod
      # quando a origem declarada é localhost. Troque junto com WEB_HOST_PORT.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5181}
      LEGACY_WRITES_UNTIL: ${LEGACY_WRITES_UNTIL:-2026-11-13T00:00:00Z}
      AUTH_IDENTITY_LIMIT: ${AUTH_IDENTITY_LIMIT:-20}
      AUTH_ORIGIN_LIMIT: ${AUTH_ORIGIN_LIMIT:-200}
      AUTH_WINDOW_SECONDS: ${AUTH_WINDOW_SECONDS:-300}
      AUTH_HASH_CONCURRENCY: ${AUTH_HASH_CONCURRENCY:-2}
      AUTH_BUCKET_SECRET: ${AUTH_BUCKET_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET com pelo menos 32 bytes}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SPEAKING_STORAGE_DIR: /app/data/speaking
      DIALOGUE_PRACTICE_ENABLED: ${DIALOGUE_PRACTICE_ENABLED:-false}
      ASSISTED_FEATURES_ENABLED: ${ASSISTED_FEATURES_ENABLED:-false}
      ASSIST_TRANSCRIPTION_URL: ${ASSIST_TRANSCRIPTION_URL:-}
      ASSIST_WRITING_URL: ${ASSIST_WRITING_URL:-}
      ASSIST_DIALOGUE_URL: ${ASSIST_DIALOGUE_URL:-}
      ASSIST_DIALOGUE_DAILY_TURNS: ${ASSIST_DIALOGUE_DAILY_TURNS:-24}
      ASSIST_PROVIDER_KIND: ${ASSIST_PROVIDER_KIND:-gateway}
      ASSIST_PROVIDER_NAME: ${ASSIST_PROVIDER_NAME:-external}
      ASSIST_PROVIDER_TOKEN: ${ASSIST_PROVIDER_TOKEN:-}
      ASSIST_OLLAMA_BASE_URL: ${ASSIST_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ASSIST_OLLAMA_MODEL: ${ASSIST_OLLAMA_MODEL:-qwen2.5:7b}
      ASSIST_DAILY_QUOTA: ${ASSIST_DAILY_QUOTA:-5}
      ASSIST_RESERVATION_SECONDS: ${ASSIST_RESERVATION_SECONDS:-900}
      ASSIST_RETENTION_DAYS: ${ASSIST_RETENTION_DAYS:-30}
      ASSIST_TIMEOUT_SECONDS: ${ASSIST_TIMEOUT_SECONDS:-20}
      ASSIST_JOB_MAX_ATTEMPTS: ${ASSIST_JOB_MAX_ATTEMPTS:-3}
      ASSIST_JOB_RETRY_BASE_SECONDS: ${ASSIST_JOB_RETRY_BASE_SECONDS:-5}
      ASSIST_JOB_STALE_SECONDS: ${ASSIST_JOB_STALE_SECONDS:-120}
      ASSIST_WORKER_POLL_SECONDS: ${ASSIST_WORKER_POLL_SECONDS:-1}
      MAINTENANCE_BATCH_SIZE: ${MAINTENANCE_BATCH_SIZE:-100}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-60}
      MAINTENANCE_CLEANUP_ENABLED: ${MAINTENANCE_CLEANUP_ENABLED:-false}
    volumes:
      - speaking_data_prod:/app/data/speaking
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Não liberar o web com banco acessível porém schema antigo/novo demais.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
    container_name: aulas-prod-worker
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Sem CAP_CHOWN: o worker só lê o áudio, e o entrypoint tolera isso.
    cap_add:
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    command: ["python", "-m", "app.cli", "assist-worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
      APP_ENV: ${APP_ENV:-prod}
      # Mesma declaração da API: com APP_ENV=prod, cookie sem Secure só com origem localhost.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5181}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET com pelo menos 32 bytes}
      SPEAKING_STORAGE_DIR: /app/data/speaking
      ASSISTED_FEATURES_ENABLED: ${ASSISTED_FEATURES_ENABLED:-false}
      ASSIST_TRANSCRIPTION_URL: ${ASSIST_TRANSCRIPTION_URL:-}
      ASSIST_PROVIDER_NAME: ${ASSIST_PROVIDER_NAME:-external}
      ASSIST_PROVIDER_TOKEN: ${ASSIST_PROVIDER_TOKEN:-}
      ASSIST_TIMEOUT_SECONDS: ${ASSIST_TIMEOUT_SECONDS:-20}
      ASSIST_JOB_MAX_ATTEMPTS: ${ASSIST_JOB_MAX_ATTEMPTS:-3}
      ASSIST_JOB_RETRY_BASE_SECONDS: ${ASSIST_JOB_RETRY_BASE_SECONDS:-5}
      ASSIST_JOB_STALE_SECONDS: ${ASSIST_JOB_STALE_SECONDS:-120}
      ASSIST_WORKER_POLL_SECONDS: ${ASSIST_WORKER_POLL_SECONDS:-1}
      MAINTENANCE_BATCH_SIZE: ${MAINTENANCE_BATCH_SIZE:-100}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-60}
      MAINTENANCE_CLEANUP_ENABLED: ${MAINTENANCE_CLEANUP_ENABLED:-false}
    volumes:
      - speaking_data_prod:/app/data/speaking
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Mesmo critério do EasyPanel: batida de worker_heartbeat com até 60 s,
      # medida pelo relógio do banco. Funciona também com o overlay de papéis
      # (entrypoint vazio, UID 10001): o exec do healthcheck não passa pelo
      # entrypoint e o venv já está no PATH da imagem.
      test: ["CMD", "python", "-m", "app.cli", "worker-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: aulas-prod-web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5181}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_prod:
    name: aulas-ingles-pgdata-prod
  speaking_data_prod:
    name: aulas-ingles-speaking-data-prod
