[project]
name = "aulas-ingles-backend"
version = "0.1.0"
description = "API do Aulas de Inglês"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "pydantic[email]>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Migrations são geradas pelo Alembic: o estilo delas não é escolha humana,
# e reformatá-las à mão só gera ruído no diff da próxima autogeneração.
[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
# O SQLAlchemy async executa dentro de greenlets. Sem declarar isso, o
# coverage perde os frames e reporta endpoints inteiros como não cobertos
# mesmo tendo teste passando em cima deles.
concurrency = ["greenlet", "thread"]
omit = ["app/openapi_dump.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
