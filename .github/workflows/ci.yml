name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Em PR, um push novo cancela a execução anterior. Na main, não: cancelar a
  # execução derrubaria também o job `deploy` no meio do `compose up`.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Nenhum job escreve no repositório; o GITHUB_TOKEN nasce só com leitura.
permissions:
  contents: read

jobs:
  security-inventory:
    name: segurança · dependências e imagens para triagem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # upload-sarif publica os achados do Trivy na aba Security; o restante do
      # workflow continua só com leitura.
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: inventário Python bloqueado no lock de produção
        run: |
          uv export --project backend --locked --no-dev --no-emit-project \
            --output-file "$RUNNER_TEMP/backend-requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/backend-requirements.txt" \
            --format json --output "$RUNNER_TEMP/backend-pip-audit.json"
        continue-on-error: true
      - name: inventário npm de produção
        run: |
          npm audit --omit=dev --json --prefix frontend \
            > "$RUNNER_TEMP/frontend-npm-audit.json" || true
          npm audit --omit=dev --json --prefix e2e \
            > "$RUNNER_TEMP/e2e-npm-audit.json" || true
      - name: imagens-base por digest, com origens equivalentes
        run: bash ops/ci_pull_bases.sh
      - name: constrói imagens candidatas sem publicá-las
        run: |
          docker build -f backend/Dockerfile.prod -t aulas-ingles-ci-api:${{ github.sha }} .
          docker build -f frontend/Dockerfile.prod -t aulas-ingles-ci-web:${{ github.sha }} frontend
      - name: inventário Trivy da imagem da API
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: aulas-ingles-ci-api:${{ github.sha }}
          version: v0.76.0
          scanners: vuln
          format: json
          output: trivy-api.json
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: '0'
      - name: inventário Trivy da imagem web
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: aulas-ingles-ci-web:${{ github.sha }}
          version: v0.76.0
          scanners: vuln
          format: json
          output: trivy-web.json
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: '0'
      # SARIF para a aba Security (code scanning). Mesma política de triagem da
      # Sprint 42 (docs/politica_triagem_seguranca_sprint_42.md): inventário,
      # não aprovação — nenhum destes passos bloqueia o workflow.
      - name: Trivy da imagem da API em SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: aulas-ingles-ci-api:${{ github.sha }}
          version: v0.76.0
          scanners: vuln
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: '0'
      - name: Trivy da imagem web em SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: aulas-ingles-ci-web:${{ github.sha }}
          version: v0.76.0
          scanners: vuln
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: '0'
      - name: publica SARIF da API na aba Security
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-api.sarif
          category: trivy-image-api
      - name: publica SARIF da web na aba Security
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-web.sarif
          category: trivy-image-web
      - name: publica relatórios para triagem, sem expor lock exportado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-inventory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/backend-pip-audit.json
            ${{ runner.temp }}/frontend-npm-audit.json
            ${{ runner.temp }}/e2e-npm-audit.json
            trivy-api.json
            trivy-web.json
            trivy-api.sarif
            trivy-web.sarif
          if-no-files-found: warn
          retention-days: 14

  infra-lint:
    name: infra · shellcheck + hadolint + actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Os três rodam em container com versão fixa: o resultado não muda
      # porque o runner atualizou uma ferramenta durante a noite.
      # Cada script declara o shell no shebang; o shellcheck usa o de cada um.
      - name: shellcheck nos seis scripts versionados
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          koalaman/shellcheck-alpine:v0.11.0
          shellcheck --severity=style
          backend/docker-entrypoint.prod.sh
          infra/easypanel/apply-grants.sh
          infra/easypanel/postgres-init.sh
          ops/ci_pull_bases.sh
          ops/ci_pull_postgres.sh
          ops/deploy_public.sh
      - name: hadolint nas imagens
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          hadolint/hadolint:v2.14.0-alpine
          hadolint backend/Dockerfile backend/Dockerfile.prod
          frontend/Dockerfile frontend/Dockerfile.prod
          infra/easypanel/Dockerfile.postgres
      - name: actionlint nos workflows
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.7 -color

  recovery:
    name: recovery · backup de banco e voz + restore isolado
    runs-on: ubuntu-latest
    # Recovery, upgrade DB-42, conversa INFRA-48 e papéis; builds compartilham cache.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --project backend --group dev --locked
      - name: lint e guardas operacionais sem banco
        run: |
          uv run --project backend ruff check --config backend/pyproject.toml ops
          uv run --project backend mypy --config-file mypy-ops.ini
          make test-recovery
      - name: PostgreSQL por digest, com origens equivalentes e espera limitada
        run: bash ops/ci_pull_postgres.sh
      - name: imagens-base por digest, com origens equivalentes
        run: bash ops/ci_pull_bases.sh
      - name: laboratório sem portas ou volumes de estudo
        run: make recovery-lab-up
      - name: migrations, seed e WAV de silêncio sintético
        run: make recovery-lab-prepare
      - name: dois pacotes, restore verificado e recusa de destino ocupado
        run: make test-recovery-integration
      - name: laboratório separado na revisão anterior, com todas as modalidades
        run: |
          make upgrade-lab-up
          make upgrade-lab-prepare
      - name: upgrade representativo, Alembic check e leitura de voz pela aplicação
        run: make test-upgrade-integration
      - name: encerra laboratório DB-42 sem remover volumes
        if: always()
        run: make upgrade-lab-down
      - name: backup de conversa, restauração e leitura pela aplicação (INFRA-48)
        run: |
          uv run --project backend python -m ops.dialogue_recovery up
          uv run --project backend python -m ops.dialogue_recovery prepare
          uv run --project backend python -m ops.dialogue_recovery check
      - name: encerra somente o laboratório INFRA-48; preserva volumes
        if: always()
        run: uv run --project backend python -m ops.dialogue_recovery down
      - name: ensaio sintético de papéis separados
        run: |
          make roles-lab-up
          make roles-lab-prepare
          make test-roles
      - name: encerra somente laboratório de papéis
        if: always()
        run: make roles-lab-down
      # Não subir dumps/áudios/manifestos para artifacts de CI.
      - name: encerra só o laboratório; não apaga volumes
        if: always()
        run: make recovery-lab-down

  backend:
    name: backend · ruff + mypy + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://aulas_test:aulas_test_only@127.0.0.1:55435/aulas_ingles_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --locked
      - name: ruff
        run: uv run ruff check .
      - name: mypy (strict)
        run: uv run mypy app
      - name: PostgreSQL por digest, com origens equivalentes e espera limitada
        run: bash ../ops/ci_pull_postgres.sh
      - name: PostgreSQL exclusivo de testes, com papel limitado
        run: |
          docker compose -f ../infra/compose.test.yml up -d --wait
          uv run python -m app.testing check
      - name: migrations (ciclo legado reversível, expansão e alinhamento)
        run: |
          # A partir da Sprint 38 os recibos não admitem downgrade destrutivo.
          # Preserva o ciclo antigo na base vazia; a recusa nova tem teste próprio.
          uv run alembic upgrade c95f3d8ba042
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: seed
        run: uv run python -m app.cli seed
      - name: seed de novo é idempotente
        run: uv run python -m app.cli seed
      - name: pytest com piso de cobertura
        run: uv run pytest -q --cov --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: falhas controladas de banco, provedor e retomada do worker
        working-directory: .
        run: make test-failure-rehearsal
      - name: cenários temporais rodam igual em outro fuso
        env:
          TZ: Pacific/Kiritimati
        run: uv run pytest -q --strict-markers -m timezone
      - name: o contrato continua válido depois do cutover de 13/11/2026
        # conftest respeita LEGACY_WRITES_UNTIL do ambiente: writes sem revisão
        # recebem 428 e testes marcados legacy_client são pulados. Roda os
        # arquivos que exercitam rotas com expected_revision/idempotency_key.
        env:
          LEGACY_WRITES_UNTIL: "2000-01-01T00:00:00Z"
        run: >-
          uv run pytest -q -rs
          tests/test_concurrency.py tests/test_progress.py tests/test_writing.py
          tests/test_writing_update.py tests/test_review.py tests/test_notebook.py
          tests/test_dashboard.py tests/test_practice.py tests/test_media.py
          tests/test_activity.py tests/test_course_reviews.py tests/test_account_deletion.py
          tests/test_editorial_archive.py tests/test_publication.py tests/test_assist_quota.py
          tests/test_dialogue_routes.py tests/test_dialogue_learning.py tests/test_dialogue_security.py
          tests/test_dialogue_frontend_contract.py
          tests/test_dialogue_check_details.py
      - name: encerra apenas a base descartável do job
        if: always()
        run: docker compose -f ../infra/compose.test.yml down

  frontend:
    name: frontend · eslint + tsc + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: tipos em sincronia com o contrato
        run: npm run check:api
      - name: eslint
        run: npm run lint
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm run test
      - name: build de produção
        run: npm run build
      - name: orçamento de performance
        run: npm run check:budget
      - name: regressão dos limites de bundle
        run: npm run test:scripts
      - name: dependências dos testes de navegador isolados
        run: npm ci --prefix ../e2e
      - name: Chromium para validar a fila entre abas (sem API ou banco)
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: fila, recuperação e conversa desktop/mobile (isoladas)
        working-directory: e2e
        run: npm run test:queue
      - name: atualização PWA entre abas e instalação interrompida (sem API ou banco)
        working-directory: e2e
        run: npm run test:pwa

  e2e:
    name: e2e · fluxo completo na stack descartável
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          # O builder do daemon enxerga as imagens-base pré-carregadas; um builder
          # em container não enxerga e voltaria a depender do registro.
          driver: docker
      - name: PostgreSQL por digest, com origens equivalentes e espera limitada
        run: bash ops/ci_pull_postgres.sh
      - name: imagens-base por digest, com origens equivalentes
        run: bash ops/ci_pull_bases.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: instala o Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: guardas contra alvos/volumes de estudo
        working-directory: e2e
        run: npm run test:safety
      - name: sobe somente a stack descartável (migration e seed sob guarda)
        run: make e2e-up
      - name: roda o E2E desktop/mobile, incluindo diálogo com worker e gateway sintético
        working-directory: e2e
        run: npm test
      - name: logs da API quando falha
        if: failure()
        run: docker compose --env-file infra/e2e.env -p aulas-ingles-e2e -f infra/compose.e2e.yml logs api prepare worker gateway
      - name: guarda o trace quando falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
      - name: encerra somente a stack descartável
        if: always()
        run: make e2e-down

  # Deploy da stack pública do EasyPanel por SSH, só quando os quatro jobs
  # bloqueantes passaram num push à main. Executa ops/deploy_public.sh, que
  # reproduz o procedimento registrado em docs/deploy_easypanel.md (seção
  # "Deploy automatizado"). Um CI vermelho não chega ao EasyPanel: o job nem
  # inicia.
  #
  # Três secrets (Settings → Secrets and variables → Actions, ou no environment
  # `production`):
  #   PUBLIC_DEPLOY_SSH_KEY      chave privada OpenSSH criada SÓ para este deploy
  #                              (ssh-keygen -t ed25519), com a pública em
  #                              authorized_keys do usuário de deploy na VM;
  #   PUBLIC_DEPLOY_KNOWN_HOSTS  linha(s) de `ssh-keyscan -t ed25519 <host>`; com
  #                              StrictHostKeyChecking=yes um host desconhecido é
  #                              recusado, nunca aceito no primeiro acesso;
  #   PUBLIC_DEPLOY_HOST         destino `usuario@host` (opcional; o script tem o
  #                              padrão documentado).
  # Sem PUBLIC_DEPLOY_SSH_KEY o job apenas avisa e termina verde: o deploy fica
  # desarmado até o segredo existir. Alternativa ao SSH: um token da API do
  # EasyPanel disparando o deploy do serviço (o painel passaria a registrar a
  # ação no histórico); o painel ainda não emitiu esse token para esta conta.
  deploy:
    name: deploy · stack pública do EasyPanel (main verde)
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, recovery]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 20
    concurrency:
      group: deploy-public
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # O script confere que o SHA é ancestral de origin/main.
          fetch-depth: 0
      - name: decide se o deploy está armado
        id: gate
        env:
          DEPLOY_KEY: ${{ secrets.PUBLIC_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::deploy automatizado desarmado: o segredo PUBLIC_DEPLOY_SSH_KEY não existe. O SHA ${GITHUB_SHA} passou no CI mas não foi publicado; publique com 'make deploy-public sha=${GITHUB_SHA}' ou crie as secrets (docs/deploy_easypanel.md, seção Deploy automatizado)."
            echo "armed=false" >> "$GITHUB_OUTPUT"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: instala a chave exclusiva de deploy e o known_hosts
        if: steps.gate.outputs.armed == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.PUBLIC_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PUBLIC_DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::PUBLIC_DEPLOY_KNOWN_HOSTS vazio: com StrictHostKeyChecking=yes a chave do host precisa vir do segredo, não de um primeiro acesso."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf 'IdentitiesOnly yes\nIdentityFile %s\n' "$HOME/.ssh/id_deploy" > "$HOME/.ssh/config"
          chmod 0700 "$HOME/.ssh"
          chmod 0600 "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
      - name: deploy do SHA aprovado, gate dos one-shots e smokes HTTPS
        if: steps.gate.outputs.armed == 'true'
        env:
          AULAS_PUBLIC_SSH_HOST: ${{ secrets.PUBLIC_DEPLOY_HOST }}
        run: bash ops/deploy_public.sh "$GITHUB_SHA"
