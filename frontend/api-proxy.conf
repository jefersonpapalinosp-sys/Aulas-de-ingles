# Proxy para a API, compartilhado por /api/ e /api/auth/.
#
# Bytes decimais, mesmo teto do contrato /api/speaking/policy (não 2 MiB).
client_max_body_size 2000000;
client_body_timeout 30s;

# Com o nome literal, o nginx resolve `api` uma vez no boot e guarda o IP:
# recriar só o container da API deixava o web em 502 até reiniciar. Com
# variável, a resolução acontece por requisição, via DNS embutido do Docker
# (127.0.0.11), respeitando o TTL curto abaixo. Sem URI na variável, o nginx
# repassa o caminho original intacto (/api/...), igual ao comportamento
# anterior de `proxy_pass http://api:8000;`.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream http://api:8000;
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Substitui a cadeia recebida: a API recebe somente a origem validada no nginx.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $aulas_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_buffering off;
proxy_request_buffering off;
# Não repetir escritas automaticamente em outro upstream.
proxy_next_upstream off;
