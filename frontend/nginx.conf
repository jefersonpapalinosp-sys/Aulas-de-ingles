# O Easypanel/Traefik termina TLS e encaminha HTTP para este container. Preserve
# o protocolo público somente quando ele vier com um valor conhecido; sem proxy
# (localhost), use o protocolo observado pelo próprio nginx.
map $http_x_forwarded_proto $aulas_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

map $aulas_forwarded_proto $aulas_hsts {
    default "";
    https "max-age=31536000";
}

# Teto de borda para as rotas de autenticação, antes de a requisição custar
# hash de senha na API (AUTH_HASH_CONCURRENCY=2 lá).
#
# Atrás do Traefik, `$binary_remote_addr` é o IP do proxy: a chave é a mesma
# para todo mundo e este limite é um **teto global da borda**, não um limite
# por cliente. É de propósito — usar `X-Forwarded-For` como chave seria
# confiar num cabeçalho que o cliente escolhe. O limite por identidade e por
# origem continua na API, onde o cabeçalho não é confiável e os contadores são
# atômicos no banco (AUTH_IDENTITY_LIMIT / AUTH_ORIGIN_LIMIT).
#
# O número é deliberadamente generoso, justamente porque é global: 10 r/s com
# rajada de 120 fica ordens de magnitude acima de qualquer uso legítimo (e da
# suíte E2E, que cria uma conta por teste) e ainda corta uma enxurrada antes
# dela custar hash de senha. Precisão é trabalho da API, não daqui.
limit_req_zone $binary_remote_addr zone=aulas_auth:1m rate=600r/m;

# Escritas do diálogo: teto global atrás do proxy. GET de polling não consome
# esta zona; cota por aluno continua transacional na API.
map $request_method $aulas_dialogue_write_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    DELETE $binary_remote_addr;
}
limit_req_zone $aulas_dialogue_write_key zone=aulas_dialogue:1m rate=120r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # A versão do nginx não é informação que o aluno precise, e numa resposta
    # de erro ela só serve para quem procura a falha conhecida da versão.
    server_tokens off;

    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Sem `Vary: Accept-Encoding`, um cache intermediário pode entregar a
    # resposta comprimida a um cliente que não a pediu.
    gzip_vary on;

    # O bundle tem hash no nome: pode ser cacheado para sempre. Um único
    # Cache-Control (sem `expires`), e sem `always` para não cachear um 404.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @previous_assets;
    }

    # Abas com SW anterior ainda pedem chunks lazy da versão antiga. O volume
    # retém somente assets; nunca devolve HTML como resposta de um módulo JS.
    location @previous_assets {
        root /var/lib/aulas-web;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Autenticação: mesmo proxy da API, com o teto de borda aplicado. O bloco
    # existe separado porque `limit_req` só vale no contexto em que aparece;
    # as diretivas de proxy vêm do arquivo incluído, que é o mesmo de /api/.
    location /api/auth/ {
        include /etc/nginx/security-headers.conf;
        limit_req zone=aulas_auth burst=120 nodelay;
        # 429 em vez do 503 padrão: é o que a interface já traduz em "aguarde
        # antes de tentar novamente", e não sugere que o serviço caiu.
        limit_req_status 429;
        include /etc/nginx/api-proxy.conf;
    }

    location ~ ^/api/speaking/dialogues(?:/|$) {
        include /etc/nginx/security-headers.conf;
        limit_req zone=aulas_dialogue burst=24 nodelay;
        limit_req_status 429;
        include /etc/nginx/api-proxy.conf;
    }

    # A API fica atrás da mesma origem, igual ao proxy do Vite em dev.
    # É o que permite o cookie httpOnly do refresh funcionar sem CORS.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/api-proxy.conf;
    }

    # O HTML de entrada nunca pode ficar preso no cache do navegador: é ele que
    # aponta para o bundle com hash novo após um deploy. Toda rota da SPA termina
    # aqui pelo redirecionamento interno do try_files abaixo.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # SPA: qualquer rota desconhecida devolve o index e o router resolve.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
