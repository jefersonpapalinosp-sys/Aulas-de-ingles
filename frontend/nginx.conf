# O Easypanel/Traefik termina TLS e encaminha HTTP para este container. Preserve
# o protocolo público somente quando ele vier com um valor conhecido; sem proxy
# (localhost), use o protocolo observado pelo próprio nginx.
map $http_x_forwarded_proto $aulas_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

map $aulas_forwarded_proto $aulas_hsts {
    default "";
    https "max-age=31536000";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # O bundle tem hash no nome: pode ser cacheado para sempre. Um único
    # Cache-Control (sem `expires`), e sem `always` para não cachear um 404.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A API fica atrás da mesma origem, igual ao proxy do Vite em dev.
    # É o que permite o cookie httpOnly do refresh funcionar sem CORS.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        # Bytes decimais, mesmo teto do contrato /api/speaking/policy (não 2 MiB).
        client_max_body_size 2000000;
        client_body_timeout 30s;
        # Com o nome literal, o nginx resolve `api` uma vez no boot e guarda o
        # IP: recriar só o container da API deixava o web em 502 até reiniciar.
        # Com variável, a resolução acontece por requisição, via DNS embutido do
        # Docker (127.0.0.11), respeitando o TTL curto abaixo. Sem URI na
        # variável, o nginx repassa o caminho original intacto (/api/...), igual
        # ao comportamento anterior de `proxy_pass http://api:8000;`.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $aulas_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # O HTML de entrada nunca pode ficar preso no cache do navegador: é ele que
    # aponta para o bundle com hash novo após um deploy. Toda rota da SPA termina
    # aqui pelo redirecionamento interno do try_files abaixo.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    # SPA: qualquer rota desconhecida devolve o index e o router resolve.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
