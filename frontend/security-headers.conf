# Política compatível com o bundle local, gravações blob: e mídia oficial VOA.
# HTTPS/HSTS pertencem ao proxy público; não forçar upgrade no localhost HTTP.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob: https://voa-audio.voanews.eu https://voa-video.voanews.eu; manifest-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
